# forecast_eval/config/secrets.example.toml
#
# TEMPLATE. Copy to `secrets.toml` in this directory and fill in the real values:
#
#     cp forecast_eval/config/secrets.example.toml forecast_eval/config/secrets.toml
#
# `config/secrets.toml` is GITIGNORED and must stay that way. `live/credentials.py`
# refuses to read it if git is tracking it, and tells you to rotate the keys —
# assume anything committed is disclosed.
#
# WHY ONE CREDENTIAL PER DEPLOYMENT (STRATEGY_SPLIT_PLAN S8):
# the three deployments must not share a futures account. One account is one
# NETTED position, so DAY long 1 against NIGHT short 1 is flat at the venue,
# every deployment's mirror disagrees with `list_positions`, and
# `SafetyRails.on_reconcile` halts all of them on the first overlapping bar.
# Separate accounts make each deployment's position its own, and every rail
# already scopes by account.
#
# There is no account field here on purpose. `live/cli.py` already fingerprints
# the account behind every run (digested, stored per deployment in
# live_account.json) and tells you if it moves — with nothing to keep in step by
# hand. See STRATEGY_SPLIT_PLAN 13.

# =============================================================================
# ONE INSTANCE AT A TIME. NEVER TWO, WHATEVER THE SESSION.
# =============================================================================
# Three credentials here do NOT let three deployments run at once.
#
# MEASURED 2026-09-02, live (STRATEGY_SPLIT_PLAN 14): with separate API keys, a
# deployment's callback hears only its OWN fills, but list_positions returns the
# COMBINED book to every one of them. An API key is an authentication boundary,
# not a position boundary. Two instances therefore net against each other -- a
# BUY from one and a SELL from the other really do flatten the position -- and
# both then halt on `mirror != venue`.
#
# "Their sessions do not overlap" is not a safe reason to run two: DAY's median
# hold is 20 calendar days and NIGHT's is 4.5, so a position opened in one
# session is still open during the other.
#
# What these three sections ARE for: selecting which credential a process uses.
#
# NOT for sub-accounts. MEASURED 2026-09-07 (STRATEGY_SPLIT_PLAN 17.1): shioaji
# 1.7.2 cannot address a sub-account at all -- `subaccount` is a read-only label
# on inbound deals, absent from FuturesOrder, Account, list_positions and
# FuturePosition. No broker offer reaches it from this SDK.
#
# The route that IS built is the owning process (STRATEGY_SPLIT_PLAN 18): one
# process holds the session that places every order, and each deployment runs
# `live/cli.py --broker client`, logging in on its own key for the MARKET FEED
# only. Four sessions on one credential coexist (MEASURED, 18.13).
#
# The rule above still stands for `--broker shioaji`, and stands for the owner
# too until G6 passes against a real session (tools/g6_live.py).
# =============================================================================

[night]
api_key = "REPLACE_ME"
secret_key = "REPLACE_ME"

[day]
api_key = "REPLACE_ME"
secret_key = "REPLACE_ME"

[fullday]
api_key = "REPLACE_ME"
secret_key = "REPLACE_ME"

# The fourth deployment (2026-10-27): the DAY half trades DAY, the NIGHT half
# NIGHT, one position between them. Like the others it logs in for the market
# feed only; orders go through the owner. It may reuse another section's keys:
# MEASURED 2026-10-26, six logins on the same person coexisted (sessions 4-6
# reused the day/fullday/night keys) and the first stayed usable
# (docs/live/multi_deploy_probe.md).
[hybrid]
api_key = "REPLACE_ME"
secret_key = "REPLACE_ME"

# Alerts to Telegram -- one bot and one chat for every deployment. Optional:
# delete the section to run without it. See docs/live/telegram.md.
#   bot_token  from @BotFather
#   chat_id    `python -m forecast_eval.live.telegram --find-chat` prints it
#   level      starting level only (info | trade | warn | fatal); the bot's
#              /settings button overrides it, shared by every deployment.
#              FATAL always sends.
[telegram]
bot_token = "REPLACE_ME"
chat_id = "REPLACE_ME"
level = "info"
